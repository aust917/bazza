[workspace]

[package]
name = "bazza-discord-probe"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
transcribe = ["dep:bazza-asr", "dep:bazza-capture", "dep:tempfile"]

[dependencies]
anyhow = "1"
bazza-discord = { path = "../../crates/bazza-discord" }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
bazza-asr = { path = "../../crates/bazza-asr", optional = true }
bazza-capture = { path = "../../crates/bazza-capture", optional = true }
tempfile = { version = "3", optional = true }

[profile.dev.package.whisper-rs-sys]
opt-level = 3

[profile.dev.package.serenity-voice-model]
debug-assertions = false
