[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Dallenlol/hark"

[workspace.dependencies]
bazza-domain = { path = "crates/bazza-domain" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Native AI libraries must be optimised even in dev builds: a Debug ggml is 20-50x slower.
[profile.dev.package.llama-cpp-sys-2]
opt-level = 3
[profile.dev.package.whisper-rs-sys]
opt-level = 3
[profile.dev.package.sherpa-rs-sys]
opt-level = 3
[profile.dev.package.bazza-capture]
opt-level = 2

# The upstream voice-model crate prints raw DAVE handshake bytes in debug builds.
[profile.dev.package.serenity-voice-model]
debug-assertions = false
