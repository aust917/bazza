[package]
name = "bazza-capture-handoff"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
tempfile.workspace = true
sha2 = "0.10"
chrono.workspace = true
bazza-service-transport = { path = "../bazza-service-transport" }
bazza-media-gate = { path = "../bazza-media-gate" }
bazza-domain = { path = "../bazza-domain" }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
