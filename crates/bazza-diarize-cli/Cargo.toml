[package]
name = "bazza-diarize-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Sidecar: Nemotron/pyannote speaker diarization and TitaNet voiceprints (WAV in, JSON out)"

[[bin]]
name = "bazza-diarize"
path = "src/main.rs"

[dependencies]
sherpa-rs = { version = "0.6", default-features = false, features = ["download-binaries"] }
sherpa-rs-sys = { version = "0.6.8", default-features = false, features = ["download-binaries"] }
bazza-diarize = { path = "../bazza-diarize" }
bazza-models = { path = "../bazza-models" }
hound = "3.5"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
libloading = "0.8.9"
