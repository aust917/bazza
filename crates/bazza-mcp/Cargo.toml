[package]
name = "bazza-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bazza-service-api = { path = "../bazza-service-api" }
bazza-service-client = { path = "../bazza-service-client" }
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time"] }
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
anyhow.workspace = true
tempfile.workspace = true
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
tokio = { version = "1", features = ["process"] }

[dev-dependencies]
bazza-core = { path = "../bazza-core" }
bazza-service = { path = "../bazza-service" }
bazza-service-test-support = { path = "../bazza-service-test-support" }
tempfile.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "process"] }
