[package]
name = "bazza-asr"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = []
cuda = ["whisper-rs/cuda"]
metal = ["whisper-rs/metal"]

[dependencies]
whisper-rs = { version = "0.16", default-features = false, features = ["raw-api"] }
crossbeam-channel.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }

[dev-dependencies]
hound = "3.5"
tokio = { version = "1", features = ["io-util"] }
