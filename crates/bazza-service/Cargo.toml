[package]
name = "bazza-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bazza-core = { path = "../bazza-core" }
bazza-service-api = { path = "../bazza-service-api" }
bazza-service-client = { path = "../bazza-service-client" }
bazza-service-transport = { path = "../bazza-service-transport" }
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
uuid.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
sha2 = "0.10"
bazza-capture-handoff = { path = "../bazza-capture-handoff" }
bazza-service-test-support = { path = "../bazza-service-test-support" }
tempfile.workspace = true
