[package]
name = "bazza-service-transport"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt", "time"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
