name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            ~/.cache/sherpa-rs
            ~/Library/Caches/sherpa-rs
            ~/AppData/Local/sherpa-rs
      - name: Install LLVM (bindgen)
        if: runner.os == 'Windows'
        run: choco install -y llvm
      - name: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Prepare desktop test placeholders
        shell: bash
        run: |
          # tauri-build resolves these paths even for tests. The tests use
          # fixtures and skip model-dependent sidecar runs by default.
          triple=$(rustc -vV | sed -n 's/host: //p')
          ext=""; [[ "$RUNNER_OS" == "Windows" ]] && ext=".exe"
          mkdir -p src-tauri/binaries src-tauri/resources/nemo-speech
          touch "src-tauri/binaries/ffmpeg-${triple}${ext}" "src-tauri/binaries/bazza-diarize-${triple}${ext}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            touch "src-tauri/binaries/bazza-service-${triple}${ext}" "src-tauri/binaries/bazza-mcp-${triple}${ext}"
          fi
      - name: Build tests
        run: cargo test --locked --workspace --no-run
      - name: Stage runtime libraries next to the test binaries
        run: node scripts/stage-runtime-libs.mjs --profile debug
      - name: Rust tests
        run: cargo test --locked --workspace
      - name: Clippy
        run: cargo clippy --locked --workspace --exclude bazza --all-targets -- -D warnings
