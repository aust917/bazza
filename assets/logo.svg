  <defs>
    <polygon id="ice-laser-layer-blue" points="2.409,-0.13 16.709,-0.13 16.245,4.42 6.455,17.07 14.955,17.07 14.491,21.62 0.191,21.62 0.655,17.07 10.445,4.42 1.945,4.42" />
